# -------------------------------------------------
# Application basic information
# -------------------------------------------------

# Name of the Spring Boot application (used in logs, tracing, monitoring, etc.)
spring.application.name=spring-jpa

# Port on which the embedded server (Tomcat) will run
server.port=8081


# -------------------------------------------------
# Database (PostgreSQL) configuration
# -------------------------------------------------

# JDBC URL of the PostgreSQL database
# Format: jdbc:postgresql://<host>:<port>/<database_name>
spring.datasource.url=jdbc:postgresql://localhost:5432/playground

# Database username
spring.datasource.username=postgres

# Database password
spring.datasource.password=Ph@ssain2025

# JDBC driver class for PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver


# -------------------------------------------------
# JPA / Hibernate configuration
# -------------------------------------------------

# Hibernate dialect for PostgreSQL
# Helps Hibernate generate optimized SQL for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# DDL mode:
# - none   : No schema changes
# - validate : Validate schema, no changes
# - update : Update schema automatically (DEV only)
# - create : Drop & create schema on startup
# - create-drop : Drop schema on shutdown
spring.jpa.hibernate.ddl-auto=update

# Show SQL queries in the console/logs
spring.jpa.show-sql=true

# Format SQL queries to make them more readable in logs
spring.jpa.properties.hibernate.format_sql=true


# -------------------------------------------------
# HikariCP (Connection Pool) configuration
# -------------------------------------------------

# Maximum number of database connections in the pool
spring.datasource.hikari.maximum-pool-size=10

# Minimum number of idle connections kept in the pool
spring.datasource.hikari.minimum-idle=2

# Maximum time (in milliseconds) a connection can stay idle
spring.datasource.hikari.idle-timeout=30000

# Maximum lifetime (in milliseconds) of a connection in the pool
spring.datasource.hikari.max-lifetime=1800000

# Maximum time (in milliseconds) to wait for a connection from the pool
spring.datasource.hikari.connection-timeout=20000
