spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/playground
    username: postgres
    password: Ph@ssain2025
    driver-class-name: org.postgresql.Driver

    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    template:
      mandatory: true
      receive-timeout: 5000
      reply-timeout: 5000
    listener:
      simple:
        default-requeue-rejected: false
        concurrency: 3
        max-concurrency: 10
        prefetch: 1

  cache:
    type: redis

    data:
      redis:
        host: localhost
        port: 6379
        timeout: 2s

        lettuce:
          pool:
            max-active: 8
            max-idle: 8
            min-idle: 2

logging:
  level:
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

