spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

    hikari:
      pool-name: HikariCP
      maximum-pool-size: 30
#      max_pool_size = (CPU cores × 2) + effective I/O wait
      #| System | Recommendation    |
      #| ------ | ----------------- |
      #| 8 CPU  | 20–30 connections |
      #| 16 CPU | 30–40 connections |
      minimum-idle: 10
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      leak-detection-threshold: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
